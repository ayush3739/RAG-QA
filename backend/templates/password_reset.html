<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,sans-serif;color:#18181b;">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;">
        <h1 style="margin:0 0 16px;font-size:24px;font-weight:700;">Password reset</h1>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Hello {{ username }},</p>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">We received a request to reset your password. Use the button below to continue.</p>
        <p style="margin:24px 0;">
            <a href="{{ action_url }}" style="display:inline-block;padding:12px 20px;background:#18181b;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;">{{ action_text }}</a>
        </p>
        <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">{{ expiry_text }}</p>
        <p style="margin:0 0 8px;font-size:14px;line-height:1.6;">If the button does not work, use this link:</p>
        <p style="margin:0 0 16px;font-size:14px;line-height:1.6;word-break:break-all;"><a href="{{ action_url }}" style="color:#2563eb;">{{ action_url }}</a></p>
        <p style="margin:0 0 8px;font-size:14px;line-height:1.6;">Token:</p>
        <p style="margin:0 0 16px;padding:12px;background:#f4f4f5;border-radius:8px;font-size:13px;word-break:break-all;">{{ token }}</p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#52525b;">If you did not request this, you can ignore this email.</p>
    </div>
</body>
</html>
